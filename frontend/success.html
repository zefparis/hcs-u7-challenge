<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification Réussie - Perspecta</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .success-container {
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .success-icon {
      font-size: 80px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-container">
      <div class="success-icon">✅</div>
      <h1 style="font-size: 36px; margin-bottom: 20px; color: #48bb78;">
        Vérification Réussie !
      </h1>
      <p style="font-size: 18px; color: #666; margin-bottom: 40px;">
        Vous allez être redirigé vers l'application...
      </p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = 'https://perspecta-competences.fr/dashboard';
    }, 2000);
  </script>
</body>
</html>
